<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Передача файлов P2P (v1.0.3)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.2/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
        .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); position: relative; }
        .version { position: absolute; top: 12px; right: 16px; font-size: 11px; color: #64748b; font-weight: bold; }
        h2 { margin-top: 0; text-align: center; font-size: 20px; }
        .section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #94a3b8; }
        input[type="text"] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 16px; margin-bottom: 10px; text-align: center; }
        input[type="file"] { display: none; }
        .btn { display: block; width: 100%; padding: 12px; border: none; border-radius: 8px; background: #3b82f6; color: #fff; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; }
        .btn:hover { background: #2563eb; }
        .btn-file { background: #334155; margin-bottom: 10px; }
        .btn-file:hover { background: #475569; }
        .my-id { font-size: 18px; font-weight: bold; text-align: center; letter-spacing: 1px; color: #38bdf8; margin: 10px 0; word-break: break-all; }
        .status { font-size: 13px; text-align: center; color: #94a3b8; margin-top: 10px; }
        #downloadArea { display: none; margin-top: 15px; }
    </style>
</head>
<body>

<div class="card">
    <div class="version">v1.0.3</div>
    <h2>Передача файлов</h2>
    
    <div class="section">
        <label>Твой ID подключения:</label>
        <div id="myId" class="my-id">Подключение к серверу...</div>
    </div>

    <div class="section">
        <label>1. Выбери файл:</label>
        <label class="btn btn-file">
            Обзор...
            <input type="file" id="fileInput" onchange="updateFileName()">
        </label>
        <div id="fileName" class="status" style="margin-bottom: 10px;">Файл не выбран</div>

        <label>2. Введи ID получателя:</label>
        <input type="text" id="receiverId" placeholder="Вставь ID получателя">
        <button class="btn" onclick="sendFile()">Отправить файл</button>
    </div>

    <div id="status" class="status">Инициализация...</div>
    <div id="downloadArea">
        <a id="downloadBtn" class="btn" style="background: #22c55e;" download>Скачать полученный файл</a>
    </div>
</div>

<script>
    // Используем альтернативный хост сигналов и открытые STUN-серверы
    const peer = new Peer({
        host: 'peerjs-server.herokuapp.com',
        secure: true,
        port: 443,
        config: {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                { urls: 'stun:global.stun.twilio.com:3478' }
            ]
        }
    });

    peer.on('open', (id) => {
        document.getElementById('myId').innerText = id;
        document.getElementById('status').innerText = 'Готов к подключению (v1.0.3)';
    });

    peer.on('error', (err) => {
        console.error(err);
        // Если альтернативный сервер недоступен, пробуем переключиться на дефолтный
        if (peer.options.host !== '0.peerjs.com') {
            document.getElementById('myId').innerText = 'Переподключение...';
            document.getElementById('status').innerText = 'Смена сервера сигналов...';
            setTimeout(() => {
                location.reload();
            }, 2000);
        } else {
            document.getElementById('myId').innerText = 'Ошибка сети';
            document.getElementById('status').innerText = 'Блокировка P2P сети браузером или провайдером';
        }
    });

    peer.on('connection', (conn) => {
        document.getElementById('status').innerText = 'Подключение установлено...';

        conn.on('data', (data) => {
            if (data.file) {
                document.getElementById('status').innerText = 'Файл получен!';
                
                const blob = new Blob([data.file], { type: data.fileType });
                const url = URL.createObjectURL(blob);
                
                const downloadBtn = document.getElementById('downloadBtn');
                downloadBtn.href = url;
                downloadBtn.download = data.fileName;
                
                document.getElementById('downloadArea').style.display = 'block';
            }
        });
    });

    function updateFileName() {
        const input = document.getElementById('fileInput');
        if (input.files.length > 0) {
            document.getElementById('fileName').innerText = input.files[0].name;
        }
    }

    function sendFile() {
        const targetId = document.getElementById('receiverId').value.trim();
        const fileInput = document.getElementById('fileInput');

        if (!targetId) {
            alert('Введи ID получателя!');
            return;
        }
        if (fileInput.files.length === 0) {
            alert('Выбери файл для отправки!');
            return;
        }

        const file = fileInput.files[0];
        document.getElementById('status').innerText = 'Подключение к получателю...';

        const conn = peer.connect(targetId);

        conn.on('open', () => {
            document.getElementById('status').innerText = 'Отправка файла...';
            
            conn.send({
                file: file,
                fileName: file.name,
                fileType: file.type
            });

            document.getElementById('status').innerText = 'Файл успешно отправлен!';
        });

        conn.on('error', (err) => {
            document.getElementById('status').innerText = 'Ошибка передачи!';
        });
    }
</script>

</body>
</html>
